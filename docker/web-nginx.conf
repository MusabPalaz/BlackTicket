server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Security headers are set by the edge proxy for the whole site; nginx only
  # serves files here, so it does not repeat them and risk disagreeing.

  # Hashed asset filenames change on every build, so they can be cached hard.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # A single-page application: every unknown path is a client-side route, not a
  # missing file. index.html itself is never cached, or a deployed update would
  # keep loading the previous build's asset names.
  location / {
    add_header Cache-Control "no-store";
    try_files $uri $uri/ /index.html;
  }
}
